<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/12gig-logo.png" />
    <link rel="apple-touch-icon" href="/12gig-logo.png" />
    <title>12Gig</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static duplicate of the Contact form so Netlify's build-time bot can
      detect it (it scans the built HTML, not the React-rendered DOM).
      The real form in src/pages/Contact.tsx posts here at runtime.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="enquiry-type" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="org" />
      <input name="ref" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
